<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link type="text/css" rel="stylesheet"
        href="{{url_for('static',filename='libs/materialize/css/materialize.min.css')}}" media="screen,projection" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>

<body>

    <div class="container">
        <div class="row m-6">
            <div class="col s12 m4">
                <div class="card">
                    <div class="card-content">
                        <span class="card-title">Temperatura</span>
                        <div class="row">
                            <div class="col m6">
                                <i class="material-icons large blue-text">device_thermostat</i>
                            </div>

                            <div class="col m6">
                                <h3 id="temperatura">0°C</h3>
                            </div>

                        </div>

                    </div>

                </div>
            </div>

            <div class="col s12 m4">
                <div class="card">
                    <div class="card-content">
                        <span class="card-title">Humidade</span>
                        <div class="row">
                            <div class="col m6">
                                <i class="material-icons large blue-text">water_drop</i>
                            </div>
                            <div class="col m6">
                                <h3 id="humidade">0%</h3>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <div class="col s12 m4">
                <div class="card">
                    <div class="card-content">
                        <span class="card-title">Qualidade do ar</span>
                        <div class="row">
                            <div class="col m6">
                                <i class="material-icons large blue-text">air</i>
                            </div>

                            <div class="col m6">
                                <h3 id="qualidade_ar">41</h3>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
        <h5 class="center">Histórico de temperatura e humidade</h5>
        <div id="myChart"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script>

        const getTempHistory=async()=>{
            try{
                const response=await fetch('/api/v1/sensor')
                if(!response.ok){
                    throw new Error('Erro  ao buscar os dados')
                }
                const data=await response.json()
                if(data){
                    let day_month=[]
                    console.log(data)
                    for(let i=0; i<data.length; i++){
                        console.log(data[i].temperature)
                        options.series[0].data.push(data[i].temperature)
                        options.series[1].data.push(data[i].humidity)
                        options.labels.push(data[i].date_hour)
                    }
                    chart.render()
                }

            }catch(err){
                console.log(err)
            }
        }
        const options = {
            series: [{
                name: 'Temperatura (°C)',
                type: 'column',
                data:[]
            }, {
                name: 'Umidade (%)',
                type: 'line',
                data:[]
            }],
            chart: {
                height: 350,
                type: 'line',
                stacked: false
            },
            stroke: {
                width: [0, 3],
                curve: 'smooth'
            },
            plotOptions: {
                bar: {
                    columnWidth: '50%'
                }
            },
            colors: ['#F37021', '#3399FF'],
            dataLabels: {
                enabled: false
            },
            labels: [],
            xaxis: {
                type: 'category'
            },
            yaxis: [
                {
                    title: {
                        text: 'Temperatura (°C)',
                    },
                    min: 0,
                    max: 100
                },
                {
                    opposite: true,
                    title: {
                        text: 'Umidade (%)',
                    },
                    min: 20,
                    max: 80
                }
            ],
            legend: {
                position: 'bottom',
                horizontalAlign: 'center'
            }
        };

        const chart = new ApexCharts(document.querySelector("#myChart"), options);
        getTempHistory();
    </script>
    <script type="module" src="{{ url_for('static',filename='scripts/script.js') }}"></script>
    <script type="text/javascript"
        src="{{url_for('static',filename='libs/materialize/js/materialize.min.js')}}"></script>
</body>

</html>
